# Deployed by Vivek Nair (VN)
services:
  - type: web
    name: inbox-exorcist
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GOOGLE_CLIENT_ID
        sync: false # set in the Render dashboard — never commit it
      - key: GOOGLE_CLIENT_SECRET
        sync: false # set in the Render dashboard — never commit it
      - key: GOOGLE_REDIRECT_URI
        value: https://inbox-exorcist.onrender.com/auth/callback
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_ENV
        value: production
